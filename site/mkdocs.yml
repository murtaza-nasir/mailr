site_name: Mailr
copyright: Copyright © 2026 the Mailr authors. Gmail is a trademark of Google LLC. Mailr is not affiliated with or endorsed by Google.
site_description: Self-hosted webmail with a calendar, tasks, notes and an AI assistant, which can run entirely on local models.
site_url: https://murtaza-nasir.github.io/mailr/
repo_url: https://github.com/murtaza-nasir/mailr
repo_name: mailr
edit_uri: ""
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  # No web fonts: the public site makes no requests to font services (the in-app copy at /help/ does
  # the same through mkdocs.help.yml).
  font: false
  logo: assets/images/logo.png
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

validation:
  anchors: warn
  unrecognized_links: warn

plugins:
  - search:
      # Underscores are not separators, so MAILR_* variables and setting keys such as
      # keyboard_shortcuts are found as typed.
      separator: '[\s\-\.]+'
  # Languages. English is the default and is built at the site root. A
  # translated page sits beside its English one with the language before the extension
  # (user-guide/inbox.de.md, a translated nav title in nav_translations); a page without a
  # translation shows the English one. To add a language, add it below with `build: true`.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      # true adds the language switcher; it needs navigation.instant off (or a plain, non-contextual
      # switcher in extra.alternate). Turn it on with the second language.
      reconfigure_material: false
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/murtaza-nasir/mailr
  # Privacy-friendly page analytics, added only when these are set at build time.
  mailr_analytics:
    src: !ENV [MAILR_DOCS_ANALYTICS_SRC, ""]
    host: !ENV [MAILR_DOCS_ANALYTICS_HOST, ""]
    id: !ENV [MAILR_DOCS_ANALYTICS_ID, ""]

extra_css:
  - stylesheets/extra.css

# Mermaid from the site itself (hooks/build.py places it), never from a CDN.
extra_javascript:
  - assets/vendor/mermaid.min.js

# Strips the coverage markers and places Mermaid (hooks/build.py).
hooks:
  - hooks/build.py

