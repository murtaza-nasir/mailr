# Screenshot manifest for the documentation site.
#
# Every image under docs/assets/shots/ has one entry here: the page that shows it and how to
# reproduce it against the demo instance. The screenshot pipeline reads this file and overwrites the
# placeholder PNGs.
#
# Demo instance: `mailr demo-seed --now 2026-10-02T10:40` (add --speakr-url/--speakr-token for
# rec-* shots; set MAILR_DEMO_ASSISTANT=1 for assistant shots). Sign in as alex@northwind.example.
# Browser: timezone America/Chicago, clock fixed at the seed's --now, signed in before the steps.
#
# Fields
#   name       file name without .png (docs/assets/shots/<name>.png)
#   page       the docs page that shows it
#   platform   web | android (android = a Roborazzi capture in the app's docs test set)
#   theme      web: classic | office (Workspace) | focus | desk | cards; android: material
#   scheme     light | dark
#   viewport   desktop 1440x900 | laptop 1280x800 | phone 390x844 | wide 1680x1000 | hd 1920x1080 (web);
#              android-phone | android-fold | android-tablet
#   route      the web route to open first (android: the screen)
#   state      seed and settings needed before the steps
#   steps      what to do, in order
#   capture    full page, or the element to crop to

viewports:
  desktop:
    width: 1440
    height: 900
  laptop:
    width: 1280
    height: 800
  phone:
    width: 390
    height: 844
  wide:
    width: 1680
    height: 1000
  hd:
    width: 1920
    height: 1080
shots:
- name: home-hero
  page: index.md
  platform: web
  theme: classic
  scheme: light
  viewport: hd
  route: /mail/inbox
  state: seeded demo (mailr demo-seed --now 2026-10-02T10:40); reading_pane=right; the Calendar side panel open (the rail's Calendar button, remembered per browser in localStorage mailr.panel)
  steps:
  - goto /mail/inbox
  - click the conversation "Lumen kickoff" (Dana Whitfield) so it opens in the right-hand reading pane
