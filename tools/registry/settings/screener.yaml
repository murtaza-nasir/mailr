# User settings: the sender screener (core/screener.py).
# One line per key, `key: plain description`; `key: {internal: why}` for a key that is not a setting
# a person chooses. A key may appear in only one file of this folder. The settings map test
# (frontend/src/features/settings/groups.test.ts) checks that Settings has a place for each one.

screener: "Hold mail from first-time senders in the Screener until you allow, block or label them (off by default)."
screener_accounts: "Which mail accounts the Screener covers (personal accounts by default; not university, work or local-only ones)."
