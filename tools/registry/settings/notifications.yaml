# (frontend/src/features/settings/groups.test.ts) checks that Settings has a place for each one.

mail_notifications: "Which new mail notifies, on every device: off, VIP senders only, important, important and Primary, or all."
notify_approvals: "Notify about approvals and failed sends, on every device."
notify_assistant: "Notify about messages from the assistant and standing orders, on every device."
notify_accounts: "Notify once when a mail account needs its password again."
