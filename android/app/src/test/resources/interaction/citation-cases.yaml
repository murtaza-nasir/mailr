# Golden vectors for the citation marker grammar (backend/mailr/intel/citegrammar.py).
#
# Run by backend/tests/test_citegrammar.py (pytest), frontend/src/features/rail/assistant/citeGrammar.test.ts
# (vitest) and Android's CiteGrammarTest (JUnit, which reads the copy in
# android/app/src/test/resources/interaction/; that copy is checked against this file in vitest).
# Same restricted shape as quickadd-cases.yaml: `key: <json>` lines, `  - <json>` cases, `#` comments.
#
# A marker is `[[kind:id…]]`, or a legacy `[c:12]`, `[event:uid]`, `[task:uid]` that is not the text of a
# Markdown link. The rules:
# 1. Kind: m, p, c, r, event, task, web, note, table, in any case, with spaces around the colon; message, msg, passage,
#    conversation, thread and recording are read as m, p, c, c, c and r.
# 2. A quoted part ("…", “…”) runs from the first quotation mark to the last. It is the quote of a
#    message or recording, or a title the model added to an event or task (ignored, used as the fallback).
# 3. Spaces around "@" are dropped; "|" and "," before the quote are allowed.
# 4. m, p and c take digits; r takes digits and an optional @seconds or @clock; event and task take
#    the first word. An event's occurrence is the last "@" followed by an ISO date or instant; a task
#    keeps "@…" in its id. web takes the first word, which must start with http:// or https:// and a
#    host; its quoted part is a title. note takes the first word: a note id of letters and digits, and
#    after "#" one item id (letters, digits and dashes), which is `at`; its quoted part is a title. Words
#    after the id without quotation marks are ignored.
# 5. `markers`: what can be read, in order. `clean`: the text a reader sees where no numbered link
#    replaced a marker: a marker that can be read is left out with the spaces before it; one that names
#    a kind but cannot be read becomes its quoted text (or nothing); `[[…]]` without a kind stays; a marker
#    left open at the end is dropped. `stream`: the same while the answer streams, where a `[` or `[[` at
#    the end is hidden too. Numbered links `[n](mailr-cite:n)` stay as they are.
cases:
  - {"id": "event-title-owner-report", "in": "mentions \"until 11 AM\" [[event:2ad60b43-fa20-4375-955f-8a5e03b55a29@2026-05-20T13:00:00+00:00 \"Chinatown walk (until ~11 AM)\"]], but that's not it.", "markers": [{"kind": "event", "id": "2ad60b43-fa20-4375-955f-8a5e03b55a29", "at": "2026-05-20T13:00:00+00:00", "quote": "Chinatown walk (until ~11 AM)"}], "clean": "mentions \"until 11 AM\", but that's not it.", "stream": "mentions \"until 11 AM\", but that's not it."}
  - {"id": "event-plain", "in": "Lunch [[event:2ad60b43-fa20-4375-955f-8a5e03b55a29@2026-05-20T13:00:00+00:00]].", "markers": [{"kind": "event", "id": "2ad60b43-fa20-4375-955f-8a5e03b55a29", "at": "2026-05-20T13:00:00+00:00", "quote": null}], "clean": "Lunch.", "stream": "Lunch."}
