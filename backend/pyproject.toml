[project]
name = "mailr"
version = "0.40.26"
description = "Self-hosted mail store and Gmail-style client"
requires-python = ">=3.12.5"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "pgvector>=0.3",
  "imapclient>=3.0",
  "aiosmtplib>=3.0",
  "dnspython>=2.6",
  "caldav>=1.3",
  "icalendar>=5.0",
  "recurring-ical-events>=3.8",
  "python-multipart>=0.0.9",
  "beautifulsoup4>=4.12",
  "html2text>=2024.2.26",
  "nh3>=0.3",
  "tinycss2>=1.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "mcp>=1.2",
  "sse-starlette>=2.1",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.14.6",
  "cronsim>=2.6",
  "pywebpush>=2.0",
  "pillow>=13",
  "pypdfium2>=4.30",
  "fasttext-predict>=0.9.2.4",
  "openpyxl>=3.1",
  "sentry-sdk[fastapi]>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
mailr = "mailr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Import mailr from this checkout (several checkouts may share one venv with an editable install).
pythonpath = ["."]
# A test that hangs fails with its name and a stack trace after 5 minutes (the suite once sat at 98%).
# "signal" fails only that test; "thread" killed the whole xdist worker and its trace was lost.
timeout = 300
timeout_method = "signal"
markers = [
  "live: calls a real model endpoint (set MAILR_LIVE=1)",
  "serial: must not run beside other tests (fixed ports, shared outside state); runs in the final single-process pass",
  "db_user: the user fixture makes a user in the database only, with no mail store account (tests that never touch the store)",
  "scale: production-sized data and query budgets (tests/test_scale_*.py); skipped unless -m scale or MAILR_TEST_SCALE=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

# The enforced rule set (CI and tools/check-backend). E501 is not selected: the line length above
# is the target for new code, and older lines up to ~130 characters stay as they are.
[tool.ruff.lint]
select = [
  "E4", "E7", "E9",  # pycodestyle errors: imports, statements, syntax
  "F",               # pyflakes
  "W",               # pycodestyle warnings
  "I",               # import order
  "UP",              # pyupgrade
  "B",               # bugbear
  "PLE",             # pylint errors
  "ASYNC",           # blocking calls in async code
  "S110",            # try/except/pass
  "BLE",             # blind `except Exception` (mark deliberate ones with noqa: BLE001)
  "RUF100",          # unused noqa
]
ignore = [
  "B008",      # FastAPI's Depends(...) in defaults is the framework's pattern
  "ASYNC109",  # a `timeout` parameter on an async function is this codebase's style
  "UP031",     # %-formatting stays where it reads better (SQL and log templates)
  "UP042",     # str+Enum -> StrEnum changes str() of the members
  "UP047",     # PEP 695 generics: adopt when a function is touched anyway
]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported from helper modules and then named as test arguments.
"tests/**" = ["F811", "S110", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["mailr"]

[tool.hatch.build.targets.wheel]
packages = ["mailr"]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "basedpyright>=1.40.2",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

# Type checking (CI and tools/check-backend). Existing errors are recorded in
# .basedpyright/baseline.json; only new ones fail. Tighten per package (core/ and api/ first).
[tool.basedpyright]
include = ["mailr"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
