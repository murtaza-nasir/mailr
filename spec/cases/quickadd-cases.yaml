# Golden vectors for the quick-add grammar of events and tasks.
#
# Run by frontend/src/lib/quickadd.test.ts (vitest) and by Android's QuickAddGrammarTest (JUnit, which
# reads the copy in android/app/src/test/resources/interaction/; that copy is checked against this file in vitest).
#
# Format: plain YAML, but every value is written as a JSON flow mapping or list on one line, so it
# can be read without a YAML library. Keep that shape: a top-level `key: <json>` line, or a case line
# `  - {...}` under `cases:`. Lines starting with `#` are comments.
#
# A case: id, mode (event | task), in (the typed text), optional now (local wall time in tz),
# optional opts (overrides of the options below), and expect. `expect.title` and `expect.tokens`
# are always checked (tokens as "kind:text" in input order; a missing list means no tokens).
# Every other field is checked only when present.
#
# "now" is Thu 1 Oct 2026 10:12 in Chicago. Oct 2026: Fri 2, Sat 3, Sun 4, Mon 5, Thu 8, Fri 9,
# Mon 12, Fri 30, Sat 31. US daylight time ends Sun 1 Nov 2026 and starts Sun 14 Mar 2027.

now: "2026-10-01T10:12"
tz: "America/Chicago"
options: {"dateOrder": "mdy", "defaultDuration": 60, "morningHour": 9, "afternoonHour": 14, "eveningHour": 18}
calendars: [{"id": "c-work", "name": "Work"}, {"id": "c-personal", "name": "Personal"}, {"id": "c-family", "name": "Family"}]
lists: [{"id": "l-inbox", "name": "Inbox"}, {"id": "l-work", "name": "Work"}, {"id": "l-groceries", "name": "Groceries"}, {"id": "l-bills", "name": "Bills"}, {"id": "l-home", "name": "Home projects"}]
people: [{"name": "Dana Whitfield", "email": "dana@example.com"}, {"name": "Dana Ortiz", "email": "dortiz@example.org"}, {"name": "Lee Park", "email": "lee@example.com"}]

# Typing (quick add once crashed while text was typed). Every prefix of each line, one
# code point at a time, in both modes, must parse without an error, with every token's text at its place.
typing: ["Call Dana fri 3pm !! @phone", "tom", "tomorrow", "every mon", "every! 3 days", "#Work", "#Home projects", "Pay rent every month on the 1st !! #Bills", "Buy milk 🥛 tmrw 9", "Dentist 12–14 oct", "Review at 15:3", "Call mom at 9 ", "Remind me in 2h", "!!!", "@", "#", "every", "3:", "fri 3p", "next week", "Ünïcödé façade 10am", "a b c", "👩‍👩‍👧 party sat 7pm", "\"quoted next week\" fri", "Lunch with Dana tomorrow 12:30 at Café Luna", "Supplier call fri 14:00 at Back office"]

cases:
# ---- ambiguity: a month word needs a day number, "at" needs a capital or a known place
  - {"id": "amb-meet-may", "mode": "event", "in": "Meet May", "expect": {"title": "Meet May", "start": null, "guests": [], "location": null}}
  - {"id": "amb-call-march", "mode": "task", "in": "Call March", "expect": {"title": "Call March", "due": null}}
  - {"id": "amb-may-with-day", "mode": "task", "in": "may 12 dentist", "expect": {"title": "dentist", "tokens": ["date:may 12"], "due": "2027-05-12"}}
  - {"id": "amb-at-home-task", "mode": "task", "in": "Stretch at home 3pm", "expect": {"title": "Stretch at home", "tokens": ["time:3pm"], "due": "2026-10-01T15:00"}}
  - {"id": "amb-tom-name", "mode": "task", "in": "Call Tom", "expect": {"title": "Call Tom", "due": null}}

# ---- product spec golden cases
  - {"id": "golden-lunch", "mode": "event", "in": "Lunch with Dana tomorrow 12:30 at Café Luna", "expect": {"title": "Lunch with Dana", "tokens": ["guest:Dana", "date:tomorrow", "time:12:30", "location:at Café Luna"], "start": "2026-10-02T12:30", "end": "2026-10-02T13:30", "all_day": false, "location": "Café Luna", "guests": [{"text": "Dana", "email": null, "confirmed": false, "matches": [{"name": "Dana Whitfield", "email": "dana@example.com"}, {"name": "Dana Ortiz", "email": "dortiz@example.org"}]}]}}
  # A series whose time has passed today still starts today (the rule the product spec left open).
  - {"id": "golden-standup", "mode": "event", "in": "Standup weekdays 9:15 for 15 min #Work", "expect": {"title": "Standup", "tokens": ["repeat:weekdays", "time:9:15", "duration:for 15 min", "collection:#Work"], "start": "2026-10-01T09:15", "end": "2026-10-01T09:30", "rrule": "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR", "duration": 15, "list_or_calendar": {"id": "c-work", "name": "Work", "create": false}, "repeat_from": null}}
  - {"id": "golden-flight", "mode": "event", "in": "Flight to Lisbon 12–14 oct", "expect": {"title": "Flight to Lisbon", "tokens": ["span:12–14 oct"], "start": "2026-10-12", "end": "2026-10-15", "all_day": true}}
  - {"id": "golden-call-mom", "mode": "task", "in": "Call mom at 9", "expect": {"title": "Call mom", "tokens": ["time:at 9"], "due": "2026-10-02T09:00", "due_all_day": false}}
  - {"id": "golden-rent", "mode": "task", "in": "Pay rent every month on the 1st !! #Bills", "expect": {"title": "Pay rent", "tokens": ["repeat:every month on the 1st", "priority:!!", "collection:#Bills"], "due": "2026-11-01", "due_all_day": true, "rrule": "FREQ=MONTHLY;BYMONTHDAY=1", "repeat_from": "due", "priority": 5, "list_or_calendar": {"id": "l-bills", "name": "Bills", "create": false}}}
  - {"id": "golden-water", "mode": "task", "in": "Water plants every! 3 days", "expect": {"title": "Water plants", "tokens": ["repeat:every! 3 days"], "due": "2026-10-04", "due_all_day": true, "rrule": "FREQ=DAILY;INTERVAL=3", "repeat_from": "completion"}}
  - {"id": "golden-quoted", "mode": "task", "in": "Read \"The next week\" report fri", "expect": {"title": "Read \"The next week\" report", "tokens": ["date:fri"], "due": "2026-10-02", "due_all_day": true}}
  - {"id": "golden-may", "mode": "task", "in": "may need to call", "expect": {"title": "may need to call", "due": null, "rrule": null}}

