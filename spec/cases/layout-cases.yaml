# Golden vectors for the overlap layout, the timed-event layout of the
# Day, N-day, Work week and Week views.
#
# Run by frontend/src/lib/eventLayout.test.ts (vitest) and by Android's EventLayoutTest (JUnit, which
# reads the copy in android/app/src/test/resources/interaction/; that copy is checked against this file in vitest).
# Same restricted shape as quickadd-cases.yaml: `key: <json>` lines, `  - <json>` cases, `#` comments.
#
# The rules, in order:
# 1. Extent. A block is drawn from its start to max(end, start + 20 min), clipped to 24:00. The drawn
#    extent is used for every overlap test below, so two short events 10 minutes apart share a row.
# 2. Clusters. Blocks that overlap directly or through a chain form a cluster. A block that starts
#    exactly when the cluster's last block ends starts a new cluster.
# 3. Columns. Blocks are sorted by start, then the longer event first, then id, and each takes the
#    first column whose last block has ended; otherwise a new column. `cols` is the cluster's count.
# 4. Widening. A block spans to the right over each next column while no block in that column
#    overlaps it; it stops at the first column that has one.
# 5. Minimum width 1/4. A cluster with more than 4 columns shows columns 0-2 (cols = 4); the blocks of
#    columns 3 and up go into "+n" chips in the fourth quarter, one chip per group of hidden blocks
#    that overlap each other (top = first top, bottom = last bottom). Shown blocks never widen into it.
# 6. Compact. An event shorter than 30 minutes (by its real times) shows its title only, on one line.
# 7. Style. partstat declined or needs-action: outline; tentative: hatched; anything else: fill.
# 8. Midnight. splitDays cuts a timed event at each local midnight (wall clock). A segment after the
#    first is `continued` (drawn with "↳"); a segment before the last `continues`. An event ending
#    exactly at 00:00 stays on its first day.
#
# A layout case: events [{id, start "HH:MM", end "HH:MM" ("24:00" allowed), partstat?, continued?}],
# expect {id: {fields checked when present: col, cols, span, top, bottom, compact, style, continued}},
# hidden [ids] (absent from placed), chips [{ids, top, bottom}] (a missing list means none).
# A split case: split [{id, start, end}] as local "YYYY-MM-DDTHH:MM", and segments (the full list).

cases:
# ---- single, pairs, clusters
  - {"id": "single", "events": [{"id": "a", "start": "09:00", "end": "10:00"}], "expect": {"a": {"col": 0, "cols": 1, "span": 1, "top": "09:00", "bottom": "10:00", "compact": false, "style": "fill", "continued": false}}}
  - {"id": "pair-overlap", "events": [{"id": "a", "start": "09:00", "end": "10:00"}, {"id": "b", "start": "09:30", "end": "10:30"}], "expect": {"a": {"col": 0, "cols": 2, "span": 1}, "b": {"col": 1, "cols": 2, "span": 1}}}
  - {"id": "adjacent-separate", "events": [{"id": "a", "start": "09:00", "end": "10:00"}, {"id": "b", "start": "10:00", "end": "11:00"}], "expect": {"a": {"col": 0, "cols": 1}, "b": {"col": 0, "cols": 1}}}
  - {"id": "chain-reuses-column", "events": [{"id": "a", "start": "09:00", "end": "10:00"}, {"id": "b", "start": "09:30", "end": "10:30"}, {"id": "c", "start": "10:00", "end": "11:00"}, {"id": "d", "start": "12:00", "end": "13:00"}], "expect": {"a": {"col": 0, "cols": 2}, "b": {"col": 1, "cols": 2}, "c": {"col": 0, "cols": 2, "span": 1}, "d": {"col": 0, "cols": 1, "span": 1}}}
  - {"id": "chain-input-order-irrelevant", "events": [{"id": "d", "start": "12:00", "end": "13:00"}, {"id": "c", "start": "10:00", "end": "11:00"}, {"id": "b", "start": "09:30", "end": "10:30"}, {"id": "a", "start": "09:00", "end": "10:00"}], "expect": {"a": {"col": 0, "cols": 2}, "b": {"col": 1, "cols": 2}, "c": {"col": 0, "cols": 2}, "d": {"col": 0, "cols": 1}}}
  - {"id": "longer-first", "events": [{"id": "a", "start": "09:00", "end": "09:30"}, {"id": "b", "start": "09:00", "end": "11:00"}], "expect": {"b": {"col": 0, "cols": 2}, "a": {"col": 1, "cols": 2}}}
  - {"id": "tie-by-id", "events": [{"id": "b", "start": "09:00", "end": "10:00"}, {"id": "a", "start": "09:00", "end": "10:00"}], "expect": {"a": {"col": 0}, "b": {"col": 1}}}
  - {"id": "nested", "events": [{"id": "a", "start": "09:00", "end": "13:00"}, {"id": "b", "start": "10:00", "end": "11:00"}, {"id": "c", "start": "11:00", "end": "12:00"}], "expect": {"a": {"col": 0, "cols": 2, "span": 1}, "b": {"col": 1, "cols": 2, "span": 1}, "c": {"col": 1, "cols": 2, "span": 1}}}
  - {"id": "three-way", "events": [{"id": "a", "start": "09:00", "end": "10:00"}, {"id": "b", "start": "09:15", "end": "10:15"}, {"id": "c", "start": "09:30", "end": "10:30"}], "expect": {"a": {"col": 0, "cols": 3}, "b": {"col": 1, "cols": 3}, "c": {"col": 2, "cols": 3}}}
  - {"id": "two-clusters-own-widths", "events": [{"id": "a", "start": "08:00", "end": "09:00"}, {"id": "b", "start": "08:00", "end": "09:00"}, {"id": "c", "start": "08:00", "end": "09:00"}, {"id": "d", "start": "14:00", "end": "15:00"}, {"id": "e", "start": "14:30", "end": "15:30"}], "expect": {"a": {"cols": 3}, "c": {"col": 2, "cols": 3}, "d": {"col": 0, "cols": 2}, "e": {"col": 1, "cols": 2}}}

# ---- widening right
  - {"id": "widen-one", "events": [{"id": "a", "start": "09:00", "end": "12:00"}, {"id": "b", "start": "09:00", "end": "10:00"}, {"id": "c", "start": "09:00", "end": "10:00"}, {"id": "d", "start": "10:30", "end": "11:30"}], "expect": {"a": {"col": 0, "cols": 3, "span": 1}, "b": {"col": 1, "cols": 3, "span": 1}, "c": {"col": 2, "cols": 3, "span": 1}, "d": {"col": 1, "cols": 3, "span": 2}}}
  - {"id": "widen-two", "events": [{"id": "a", "start": "09:00", "end": "11:00"}, {"id": "b", "start": "09:00", "end": "10:00"}, {"id": "c", "start": "09:00", "end": "10:00"}, {"id": "d", "start": "09:00", "end": "10:00"}, {"id": "e", "start": "10:00", "end": "11:00"}], "expect": {"a": {"col": 0, "cols": 4, "span": 1}, "d": {"col": 3, "cols": 4, "span": 1}, "e": {"col": 1, "cols": 4, "span": 3}}}
  - {"id": "widen-stops-at-first-conflict", "events": [{"id": "a", "start": "09:00", "end": "12:00"}, {"id": "b", "start": "09:00", "end": "10:00"}, {"id": "c", "start": "09:00", "end": "10:00"}, {"id": "d", "start": "09:00", "end": "12:00"}, {"id": "e", "start": "10:30", "end": "11:30"}], "expect": {"a": {"col": 0, "span": 1}, "d": {"col": 1, "cols": 4, "span": 1}, "b": {"col": 2, "span": 1}, "c": {"col": 3, "span": 1}, "e": {"col": 2, "cols": 4, "span": 2}}}
  - {"id": "widen-first-column-alone", "events": [{"id": "a", "start": "09:00", "end": "09:45"}, {"id": "b", "start": "09:30", "end": "11:00"}, {"id": "c", "start": "10:00", "end": "10:30"}], "expect": {"a": {"col": 0, "cols": 2, "span": 1}, "b": {"col": 1, "cols": 2, "span": 1}, "c": {"col": 0, "cols": 2, "span": 1}}}

# ---- more than four columns: "+n" chips
  - {"id": "five-columns", "events": [{"id": "a", "start": "09:00", "end": "10:00"}, {"id": "b", "start": "09:00", "end": "10:00"}, {"id": "c", "start": "09:00", "end": "10:00"}, {"id": "d", "start": "09:00", "end": "10:00"}, {"id": "e", "start": "09:00", "end": "10:00"}], "expect": {"a": {"col": 0, "cols": 4, "span": 1}, "b": {"col": 1, "cols": 4}, "c": {"col": 2, "cols": 4, "span": 1}}, "hidden": ["d", "e"], "chips": [{"ids": ["d", "e"], "top": "09:00", "bottom": "10:00"}]}
  - {"id": "four-columns-no-chip", "events": [{"id": "a", "start": "09:00", "end": "10:00"}, {"id": "b", "start": "09:00", "end": "10:00"}, {"id": "c", "start": "09:00", "end": "10:00"}, {"id": "d", "start": "09:00", "end": "10:00"}], "expect": {"d": {"col": 3, "cols": 4, "span": 1}}, "hidden": [], "chips": []}
  - {"id": "two-chip-groups", "events": [{"id": "a", "start": "09:00", "end": "12:00"}, {"id": "b", "start": "09:00", "end": "12:00"}, {"id": "c", "start": "09:00", "end": "12:00"}, {"id": "d", "start": "09:00", "end": "10:00"}, {"id": "e", "start": "09:00", "end": "10:00"}, {"id": "f", "start": "11:00", "end": "11:30"}], "expect": {"a": {"col": 0, "cols": 4}, "c": {"col": 2, "cols": 4}}, "hidden": ["d", "e", "f"], "chips": [{"ids": ["d", "e"], "top": "09:00", "bottom": "10:00"}, {"ids": ["f"], "top": "11:00", "bottom": "11:30"}]}
  - {"id": "overflow-widen-stays-left", "events": [{"id": "a", "start": "09:00", "end": "12:00"}, {"id": "b", "start": "09:00", "end": "10:00"}, {"id": "c", "start": "09:00", "end": "10:00"}, {"id": "d", "start": "09:00", "end": "10:00"}, {"id": "e", "start": "09:00", "end": "10:00"}, {"id": "f", "start": "10:30", "end": "11:30"}], "expect": {"f": {"col": 1, "cols": 4, "span": 2}, "c": {"col": 2, "span": 1}}, "hidden": ["d", "e"], "chips": [{"ids": ["d", "e"], "top": "09:00", "bottom": "10:00"}]}
  - {"id": "chip-grows-with-chain", "events": [{"id": "a", "start": "09:00", "end": "12:00"}, {"id": "b", "start": "09:00", "end": "12:00"}, {"id": "c", "start": "09:00", "end": "12:00"}, {"id": "d", "start": "09:00", "end": "10:00"}, {"id": "e", "start": "09:30", "end": "10:30"}, {"id": "f", "start": "10:15", "end": "11:00"}], "expect": {"b": {"col": 1, "cols": 4}}, "hidden": ["d", "e", "f"], "chips": [{"ids": ["d", "e", "f"], "top": "09:00", "bottom": "11:00"}]}

# ---- minimum height and compact blocks
  - {"id": "zero-length", "events": [{"id": "a", "start": "10:00", "end": "10:00"}], "expect": {"a": {"top": "10:00", "bottom": "10:20", "compact": true}}}
  - {"id": "short-events-share-row", "events": [{"id": "a", "start": "10:00", "end": "10:05"}, {"id": "b", "start": "10:10", "end": "10:40"}], "expect": {"a": {"col": 0, "cols": 2, "bottom": "10:20", "compact": true}, "b": {"col": 1, "cols": 2, "compact": false}}}
  - {"id": "min-height-ends-cluster", "events": [{"id": "a", "start": "10:00", "end": "10:05"}, {"id": "b", "start": "10:20", "end": "10:40"}], "expect": {"a": {"col": 0, "cols": 1}, "b": {"col": 0, "cols": 1, "compact": true}}}
  - {"id": "compact-boundary", "events": [{"id": "a", "start": "09:00", "end": "09:29"}, {"id": "b", "start": "10:00", "end": "10:30"}], "expect": {"a": {"compact": true, "bottom": "09:29"}, "b": {"compact": false}}}
  - {"id": "clip-at-midnight", "events": [{"id": "a", "start": "23:50", "end": "24:00"}, {"id": "b", "start": "22:00", "end": "24:00"}], "expect": {"a": {"top": "23:50", "bottom": "24:00", "compact": true, "col": 1, "cols": 2}, "b": {"bottom": "24:00", "col": 0}}}

# ---- styles and continuation
  - {"id": "styles", "events": [{"id": "a", "start": "08:00", "end": "09:00", "partstat": "declined"}, {"id": "b", "start": "10:00", "end": "11:00", "partstat": "TENTATIVE"}, {"id": "c", "start": "12:00", "end": "13:00", "partstat": "needs-action"}, {"id": "d", "start": "14:00", "end": "15:00", "partstat": "accepted"}, {"id": "e", "start": "16:00", "end": "17:00"}], "expect": {"a": {"style": "outline"}, "b": {"style": "hatched"}, "c": {"style": "outline"}, "d": {"style": "fill"}, "e": {"style": "fill"}}}
  - {"id": "continued-segment", "events": [{"id": "a", "start": "00:00", "end": "02:00", "continued": true}, {"id": "b", "start": "01:00", "end": "03:00"}], "expect": {"a": {"continued": true, "col": 0, "cols": 2}, "b": {"continued": false, "col": 1}}}

# ---- splitting at midnight
  - {"id": "split-overnight", "split": [{"id": "a", "start": "2026-10-01T22:00", "end": "2026-10-02T02:00"}], "segments": [{"id": "a", "date": "2026-10-01", "start": "22:00", "end": "24:00", "continued": false, "continues": true}, {"id": "a", "date": "2026-10-02", "start": "00:00", "end": "02:00", "continued": true, "continues": false}]}
  - {"id": "split-ends-at-midnight", "split": [{"id": "a", "start": "2026-10-01T22:00", "end": "2026-10-02T00:00"}], "segments": [{"id": "a", "date": "2026-10-01", "start": "22:00", "end": "24:00", "continued": false, "continues": false}]}
  - {"id": "split-three-days", "split": [{"id": "a", "start": "2026-10-01T20:00", "end": "2026-10-03T08:00"}], "segments": [{"id": "a", "date": "2026-10-01", "start": "20:00", "end": "24:00", "continued": false, "continues": true}, {"id": "a", "date": "2026-10-02", "start": "00:00", "end": "24:00", "continued": true, "continues": true}, {"id": "a", "date": "2026-10-03", "start": "00:00", "end": "08:00", "continued": true, "continues": false}]}
  - {"id": "split-same-day", "split": [{"id": "a", "start": "2026-10-01T09:00", "end": "2026-10-01T10:00"}], "segments": [{"id": "a", "date": "2026-10-01", "start": "09:00", "end": "10:00", "continued": false, "continues": false}]}
  - {"id": "split-starts-at-midnight", "split": [{"id": "a", "start": "2026-10-02T00:00", "end": "2026-10-02T01:00"}], "segments": [{"id": "a", "date": "2026-10-02", "start": "00:00", "end": "01:00", "continued": false, "continues": false}]}
  - {"id": "split-zero-at-midnight", "split": [{"id": "a", "start": "2026-10-02T00:00", "end": "2026-10-02T00:00"}], "segments": [{"id": "a", "date": "2026-10-02", "start": "00:00", "end": "00:00", "continued": false, "continues": false}]}
  - {"id": "split-dst-wall-clock", "split": [{"id": "a", "start": "2026-11-01T00:30", "end": "2026-11-01T03:00"}], "segments": [{"id": "a", "date": "2026-11-01", "start": "00:30", "end": "03:00", "continued": false, "continues": false}]}
  - {"id": "split-month-end", "split": [{"id": "a", "start": "2026-10-31T23:00", "end": "2026-11-01T01:00"}, {"id": "b", "start": "2026-12-31T23:30", "end": "2027-01-01T00:30"}], "segments": [{"id": "a", "date": "2026-10-31", "start": "23:00", "end": "24:00", "continued": false, "continues": true}, {"id": "a", "date": "2026-11-01", "start": "00:00", "end": "01:00", "continued": true, "continues": false}, {"id": "b", "date": "2026-12-31", "start": "23:30", "end": "24:00", "continued": false, "continues": true}, {"id": "b", "date": "2027-01-01", "start": "00:00", "end": "00:30", "continued": true, "continues": false}]}
