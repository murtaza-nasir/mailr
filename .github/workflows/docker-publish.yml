name: Docker Build and Publish

# Builds the Mailr image (the root Dockerfile: the web app, the API and the worker) for
# linux/amd64 and linux/arm64 and pushes it to the GitHub Container Registry when a GitHub
# Release is published. The image is built on public runners, so the build log shows how each
# published image was produced and from which commit; a provenance attestation and an SBOM are
# attached to it.
#
#   ghcr.io/murtaza-nasir/mailr:<version>   for a release tagged v<version>, such as 0.40.13
#   ghcr.io/murtaza-nasir/mailr:<major>.<minor>
#   ghcr.io/murtaza-nasir/mailr:latest      the newest release that is not a pre-release
#   ghcr.io/murtaza-nasir/mailr:sha-<commit>
#
# The mail server image (deploy/stalwart) is not published: deploy/docker-compose.yml always
# builds it locally.
#
# A manual run (workflow_dispatch) on a release tag publishes that release again; on a branch it
# publishes only the sha-<commit> tag.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: murtaza-nasir/mailr

permissions:
  contents: read

jobs:
  test:
    # The full test workflow gates the release.
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image for amd64 (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: mailr:smoke
          cache-from: type=gha,scope=mailr
          cache-to: type=gha,scope=mailr,mode=max

      - name: Smoke test the image
        # The command line starts, and the web app and the help pages are in the image.
        run: |
          docker run --rm mailr:smoke mailr --help > /dev/null
          docker run --rm --entrypoint /bin/sh mailr:smoke -c \
            'test -f /app/mailr/static/index.html && test -f /app/mailr/help/index.html && test -f /app/mailr/data/lid.176.ftz'

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=Mailr
            org.opencontainers.image.description=Self-hosted mail store and web client, with calendar, tasks, notes and an assistant

      - name: Build and push (amd64 and arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version the server reports (Help menu, Settings, GET /me) and tags error reports with.
          build-args: |
            MAILR_RELEASE=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=mailr
          cache-to: type=gha,scope=mailr,mode=max

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
