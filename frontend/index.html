    <style>
      /* The frame before any script loads (features/pwa/AppSkeleton.tsx draws the same in React). */
      html, body { margin: 0; background: #f4f8f9; }
      @media (prefers-color-scheme: dark) { html, body { background: #1b1b1b; } .boot i { background: #2d2e30; } }
      .boot { display: flex; flex-direction: column; gap: 14px; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px; }
      .boot i { display: block; height: 14px; border-radius: 7px; background: #e2ebee; }
      .boot i:first-child { height: 44px; border-radius: 22px; margin-bottom: 10px; }
      .boot i:nth-child(odd) { width: 82%; }
    </style>
